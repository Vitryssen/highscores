name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. One small read a day prevents it.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail --silent --show-error --output /dev/null \
            "$URL/rest/v1/games?select=id&limit=1" -H "apikey: $KEY"
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_KEY }}
